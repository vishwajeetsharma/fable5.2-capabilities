<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World · a planet made of mathematics</title>
<style>
:root { color-scheme: dark; --ink: #f2f4fb; --dim: rgba(242,244,251,.7); --line: rgba(242,244,251,.22); --glass: rgba(8,10,18,.5); --hot: #ffc46b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink);
  font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.tag { position: fixed; left: max(20px, env(safe-area-inset-left)); top: max(18px, env(safe-area-inset-top)); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  pointer-events: none; text-transform: uppercase; letter-spacing: .2em; font-size: 11px; color: var(--ink); text-shadow: 0 1px 8px rgba(0,0,0,.8); }
.tag b { font-weight: 600; }
.dock { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 11px;
  padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); pointer-events: none; }
.dock > * { pointer-events: auto; }
.hint { margin: 0; text-align: center; font-size: 12.5px; letter-spacing: .03em; pointer-events: none; transition: opacity 1.4s; padding: 5px 12px; border-radius: 999px; background: var(--glass); }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 7px 12px; border-radius: 999px; background: var(--glass);
  border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); max-width: 100%; }
.clock { font: 500 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: center; letter-spacing: .04em; }
input[type=range] { -webkit-appearance: none; appearance: none; width: min(42vw, 360px); height: 22px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #ffb35c 0%, #9fd0ff 18%, #9fd0ff 34%, #ff8a4c 50%, #1c2450 62%, #0b1030 88%, #ffb35c 100%); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #ffb35c 0%, #9fd0ff 18%, #9fd0ff 34%, #ff8a4c 50%, #1c2450 62%, #0b1030 88%, #ffb35c 100%); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); margin-top: -6px; box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--ink); }
input[type=range]:focus-visible { outline: 2px solid var(--hot); outline-offset: 4px; border-radius: 6px; }
button { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 12.5px; letter-spacing: .04em; cursor: pointer; }
button:hover { border-color: rgba(242,244,251,.6); }
button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
button.on { background: var(--ink); color: #070914; border-color: var(--ink); }
#veil { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity .45s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"></div>
<div class="tag"><b>III</b><span>World</span><span id="biome">Fjord</span><span>no images, no models, only arithmetic</span></div>
<div class="dock">
  <p class="hint" id="hint">Drag to look around. Scroll to climb. Up and down arrows change speed. Slide the sun.</p>
  <div class="row">
    <span class="clock" id="clock">16:20</span>
    <input id="tod" type="range" min="0" max="1000" value="430" aria-label="Time of day">
    <button type="button" id="cycle" class="on" aria-pressed="true">day cycle</button>
    <button type="button" id="new">new world</button>
  </div>
</div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c'), hint = $('hint'), veil = $('veil');
const fail = m => { hint.textContent = m; };
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl) return fail('This act needs WebGL 2, which this browser does not offer.');
if (!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'))) return fail('This graphics chip cannot draw into floating-point textures, which the terrain needs.');

// Shared by the height-map bake and the picture itself: noise, the flight path, and the shape of the land.
const COMMON = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uNoise;
uniform float uFreq, uHeight, uSea;
uniform vec2 uSeed;
const mat2 M2 = mat2(0.8, -0.6, 0.6, 0.8);
// value noise with its analytic derivative (yz); one texel carries all four lattice corners
vec3 noised(vec2 x){
  vec2 i = floor(x), f = x - i;
  vec2 u = f*f*f*(f*(f*6.0 - 15.0) + 10.0), du = 30.0*f*f*(f*(f - 2.0) + 1.0);
  vec4 c = texelFetch(uNoise, ivec2(i) & 255, 0);
  float k1 = c.g - c.r, k2 = c.b - c.r, k4 = c.r - c.g - c.b + c.a;
  return vec3(c.r + k1*u.x + k2*u.y + k4*u.x*u.y, du*(vec2(k1, k2) + k4*u.yx));
}
float vnoise(vec2 x){
  vec2 i = floor(x), f = x - i, u = f*f*(3.0 - 2.0*f);
  vec4 c = texelFetch(uNoise, ivec2(i) & 255, 0);
  return mix(mix(c.r, c.g, u.x), mix(c.b, c.a, u.x), u.y);
}
// The flight path. The land is pressed down along it, so there is always open water to fly over.
float pathX(float z){ return 1.7*sin(z*0.19) + 0.8*sin(z*0.41 + 1.7); }
// Height of the ground. Each octave is damped by the slope gathered so far, which carves ridges and gullies the way erosion does.
float terrain(vec2 p, int oct){
  float m = smoothstep(0.05, 1.9, abs(p.x - pathX(p.y)));
  vec2 q = p*uFreq + uSeed;
  float a = 0.0, b = 1.0; vec2 ds = vec2(0.0);
  for (int i = 0; i < 12; i++) {
    if (i >= oct) break;
    vec3 n = noised(q);
    ds += n.yz;
    a += b*n.x/(1.0 + dot(ds, ds));
    b *= 0.5; q = M2*q*2.0;
  }
  return uHeight*a*(0.05 + 0.95*m*m) - uSea;
}
`;
const BAKE = COMMON + `
uniform vec4 uMapRect;
out vec4 o;
void main(){ o = vec4(terrain(uMapRect.xy + gl_FragCoord.xy/2048.0*uMapRect.zw, 5), 0.0, 0.0, 1.0); }`;

const SCENE = COMMON + `
uniform sampler2D uMap; uniform vec4 uMapRect;
uniform vec2 uRes; uniform float uTime;
uniform vec3 uRo, uCx, uCy, uCz, uSun, uMoon, uW, uLightDir, uLightCol;
uniform float uExposure, uMist, uAurora, uSnow, uSnowAmt, uTree, uVeg, uStrata, uCloud, uFog;
uniform vec3 uRockA, uRockB, uVegA, uVegB, uSand, uDeep, uShallow, uSkyTint, uSnowCol;
out vec4 fragColor;
const float FAR = 60.0;
const float CLOUD_H = 7.0;

float hash(vec2 p){ vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float hash3(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }
float fbm4(vec2 p){ float a = 0.0, b = 0.5; for (int i = 0; i < 4; i++) { a += b*vnoise(p); p = M2*p*2.03; b *= 0.5; } return a; }
float mapH(vec2 p){ return texture(uMap, (p - uMapRect.xy)/uMapRect.zw).r; }

// Far from the ground the ray strides across a baked height map (one lookup per step);
// only inside a thin band above the surface does it evaluate the full fractal.
float march(vec3 ro, vec3 rd, float tmax){
  float t = 0.03, band = 0.062*uHeight;
  for (int i = 0; i < 140; i++) {
    vec3 p = ro + rd*t;
    float h = p.y - mapH(p.xz);
    if (h > band) h -= band*0.55;
    else { h = p.y - terrain(p.xz, t < 5.0 ? 8 : (t < 16.0 ? 7 : 6)); if (h < 0.0012*t) return t; }
    t += h*0.38 + 0.0008*t;
    if (t > tmax) return -1.0;
  }
  return t;
}
float marchRefl(vec3 ro, vec3 rd, float tmax){
  float t = 0.08;
  for (int i = 0; i < 48; i++) {
    vec3 p = ro + rd*t; float h = p.y - mapH(p.xz);
    if (h < 0.004*t) return t;
    t += h*0.5 + 0.002*t;
    if (t > tmax) return -1.0;
  }
  return -1.0;
}
vec3 normalAt(vec3 p, float t){
  float e = max(0.0012, 0.0011*t);
  int oc = t < 2.5 ? 12 : (t < 8.0 ? 10 : (t < 20.0 ? 9 : 7));
  return normalize(vec3(terrain(p.xz - vec2(e, 0.0), oc) - terrain(p.xz + vec2(e, 0.0), oc), 2.0*e,
                        terrain(p.xz - vec2(0.0, e), oc) - terrain(p.xz + vec2(0.0, e), oc)));
}
float shadow(vec3 p, vec3 l, float hmax){
  float off = max(0.0, mapH(p.xz) - p.y) + 0.02, res = 1.0, t = 0.06;
  for (int i = 0; i < 32; i++) {
    vec3 q = p + l*t;
    if (q.y > hmax) break;
    float h = q.y + off - mapH(q.xz);
    res = min(res, 8.0*h/t);
    if (res < 0.02) break;
    t += clamp(h*0.7, 0.05, 0.9);
  }
  return clamp(res, 0.0, 1.0);
}

vec3 ambient(){ return uW.x*vec3(0.20, 0.30, 0.50)*uSkyTint + uW.y*vec3(0.17, 0.13, 0.22) + uW.z*(vec3(0.010, 0.016, 0.034) + uAurora*vec3(0.002, 0.016, 0.008)); }

vec3 skyBase(vec3 rd){
  float y = max(rd.y, 0.0), g = pow(1.0 - y, 4.5);
  vec3 zen = uW.x*vec3(0.085, 0.24, 0.68)*uSkyTint + uW.y*vec3(0.075, 0.10, 0.28) + uW.z*vec3(0.003, 0.006, 0.020);
  vec3 hor = uW.x*vec3(0.50, 0.71, 0.95)*uSkyTint + uW.y*vec3(0.50, 0.30, 0.34) + uW.z*vec3(0.012, 0.022, 0.050);
  vec3 col = mix(zen, hor, g);
  float toward = 0.5 + 0.5*dot(normalize(uSun.xz + vec2(1e-4)), normalize(rd.xz + vec2(1e-4)));
  col = mix(col, mix(vec3(0.20, 0.13, 0.36), vec3(1.25, 0.52, 0.16), toward*toward*toward), uW.y*g*0.85);   // sunset band, violet on the far side
  float mu = max(dot(rd, uSun), 0.0), up = smoothstep(-0.14, 0.02, uSun.y);
  vec3 sunc = mix(vec3(1.0, 0.42, 0.13), vec3(1.0, 0.93, 0.82), smoothstep(0.0, 0.38, uSun.y));
  col += sunc*(pow(mu, 5.0)*0.16 + pow(mu, 36.0)*0.40)*up*(uW.x + uW.y*1.5);
  return col;
}
float cloudD(vec2 xz){ return smoothstep(uCloud, uCloud + 0.26, fbm4(xz*0.075 + vec2(uTime*0.012, uTime*0.005) + uSeed*0.31)); }

vec3 stars(vec3 rd){
  vec3 q = rd*170.0, i = floor(q), f = fract(q) - 0.5;
  float h = hash3(i);
  vec3 col = smoothstep(0.986, 1.0, h)*smoothstep(0.42, 0.05, length(f))*mix(vec3(1.0, 0.8, 0.6), vec3(0.7, 0.85, 1.0), fract(h*91.0))*(0.6 + 0.4*sin(uTime*2.5 + h*700.0))*3.0;
  float band = exp(-pow(dot(rd, normalize(vec3(0.45, 0.55, -0.70)))*4.2, 2.0));
  float dust = fbm4(rd.xy*5.0 + rd.z*3.0 + 7.0);
  col += band*vec3(0.50, 0.60, 0.90)*(0.04 + 0.26*dust*dust);
  q = rd*420.0; i = floor(q); f = fract(q) - 0.5; h = hash3(i + 17.0);
  col += smoothstep(0.972 - 0.06*band, 1.0, h)*smoothstep(0.45, 0.1, length(f))*(0.5 + band);
  return col;
}
vec3 aurora(vec3 ro, vec3 rd){
  vec3 col = vec3(0.0);
  float jit = hash(gl_FragCoord.xy + fract(uTime)*37.0);
  for (int i = 0; i < 20; i++) {
    float fi = float(i) + jit;
    vec2 p = ro.xz + rd.xz*((8.0 + fi*0.35 - ro.y)/rd.y);
    vec2 q = vec2(p.x*0.11 + uTime*0.012, p.y*0.035);
    float w = vnoise(q*3.0 + vec2(vnoise(q*1.3 + uTime*0.02)*2.5, 0.0));
    float sheet = pow(1.0 - abs(w*2.0 - 1.0), 12.0);
    float rays = 0.55 + 0.45*vnoise(vec2(p.x*2.3 + p.y*0.9, uTime*0.3));
    col += mix(vec3(0.08, 1.0, 0.42), vec3(0.50, 0.20, 1.0), fi/20.0)*sheet*rays*exp(-fi*0.11);
  }
  return col*0.2*smoothstep(0.03, 0.28, rd.y);
}
vec3 sky(vec3 ro, vec3 rd){
  vec3 col = skyBase(rd);
  if (rd.y <= 0.0) return col;
  float night = uW.z + 0.25*uW.y;
  if (night > 0.02) {
    col += stars(rd)*night*smoothstep(0.0, 0.16, rd.y);
    if (uAurora > 0.01 && rd.y > 0.03) col += aurora(ro, rd)*uAurora*uW.z;
  }
  float mm = dot(rd, uMoon);
  col += (smoothstep(0.99955, 0.99968, mm)*vec3(1.5, 1.5, 1.4)*(0.7 + 0.3*vnoise(rd.xy*70.0)) + vec3(0.45, 0.55, 0.9)*pow(max(mm, 0.0), 350.0)*0.3)*uW.z*smoothstep(0.0, 0.08, uMoon.y);
  col += vec3(1.0, 0.85, 0.6)*smoothstep(0.99972, 0.9999, dot(rd, uSun))*40.0*smoothstep(-0.03, 0.03, uSun.y);
  float tc = (CLOUD_H - ro.y)/rd.y;
  vec2 cp = ro.xz + rd.xz*tc;
  float d = cloudD(cp);
  if (d > 0.001) {
    float lit = clamp(0.55 + (d - cloudD(cp + uLightDir.xz*1.6))*1.4, 0.0, 1.0);
    vec3 amb = ambient()*2.4;
    vec3 cc = mix(amb*0.85 + uLightCol*0.12, uLightCol*1.15 + amb*0.6, lit);
    cc += uLightCol*pow(max(dot(rd, uLightDir), 0.0), 10.0)*0.6*(1.0 - d*0.5);
    cc = mix(skyBase(normalize(vec3(rd.x, 0.02, rd.z))), cc, exp(-tc*0.011));              // far clouds sink into the haze
    col = mix(col, cc, d*smoothstep(0.0, 0.06, rd.y)*0.94);
  }
  return col;
}
vec3 atmosphere(vec3 col, vec3 ro, vec3 rd, float t){
  vec3 fogc = skyBase(normalize(vec3(rd.x, 0.03 + max(rd.y, 0.0)*0.4, rd.z)));
  col = mix(col, fogc, 1.0 - exp(-pow(t*uFog, 1.3)));
  float b = 2.6, ry = abs(rd.y) < 1e-3 ? 1e-3 : rd.y;
  float mist = uMist*exp(-ro.y*b)*(1.0 - exp(-t*ry*b))/(ry*b);          // exact integral of fog that thins with height
  col = mix(col, fogc*1.08 + ambient()*0.4, 1.0 - exp(-max(mist, 0.0)));
  return mix(col, fogc, smoothstep(FAR*0.72, FAR, t));
}
vec3 shadeLand(vec3 p, vec3 n, float sh, vec3 rd){
  float h = p.y, n1 = vnoise(p.xz*3.1 + uSeed), n2 = vnoise(p.xz*13.0), n3 = vnoise(p.xz*47.0);
  float strata = vnoise(vec2(h*uStrata + n1*1.5, 3.7));
  vec3 col = mix(uRockA, uRockB, strata)*(0.66 + 0.68*n2);
  float veg = smoothstep(0.36, 0.72, n.y + 0.12*(n2 - 0.5))*(1.0 - smoothstep(uTree - 0.3, uTree + 0.12, h + 0.35*(n1 - 0.5)))*uVeg;
  col = mix(col, mix(uVegA, uVegB, n2)*(0.75 + 0.5*n3), veg);
  col = mix(uSand*(0.8 + 0.4*n3), col, smoothstep(0.0, 0.045, h));
  float snow = smoothstep(uSnow - 0.2, uSnow + 0.3, h + 0.5*(n1 - 0.5))*smoothstep(0.30, 0.62, n.y + 0.2*(n2 - 0.5))*uSnowAmt;
  col = mix(col, uSnowCol, snow);
  float dif = clamp(dot(n, uLightDir), 0.0, 1.0)*sh;
  float bac = clamp(0.25 + 0.75*dot(n, normalize(vec3(-uLightDir.x, 0.0, -uLightDir.z))), 0.0, 1.0);
  col *= uLightCol*dif*3.1 + ambient()*(0.4 + 0.6*n.y)*1.15 + uLightCol*bac*0.12;
  col += uLightCol*sh*pow(clamp(dot(n, normalize(uLightDir - rd)), 0.0, 1.0), 24.0)*0.3*snow;
  return col;
}
vec3 render(vec3 ro, vec3 rd){
  float hmax = uHeight*1.7 - uSea;
  float tw = rd.y < -1e-4 ? -ro.y/rd.y : 1e9;
  float tmax = min(FAR, tw + 0.02);
  if (rd.y > 0.0) tmax = min(tmax, (hmax - ro.y)/rd.y);
  float t = march(ro, rd, tmax);
  bool lit = uLightCol.r + uLightCol.g + uLightCol.b > 0.002 && uLightDir.y > 0.0;
  if (t > 0.0 && t < tw) {
    vec3 p = ro + rd*t, n = normalAt(p, t);
    float sh = 0.0;
    if (lit) { sh = shadow(p, uLightDir, hmax); sh *= 1.0 - 0.6*cloudD(p.xz + uLightDir.xz*((CLOUD_H - p.y)/max(uLightDir.y, 0.08))); }
    return atmosphere(shadeLand(p, n, sh, rd), ro, rd, t);
  }
  if (tw < FAR) {
    vec3 p = ro + rd*tw;
    float depth = -terrain(p.xz, 6);
    vec2 q = p.xz*5.0; float tt = uTime*0.7;
    vec2 g = noised(q + vec2(tt, tt*0.6)).yz*0.5 + noised(q*2.7 - vec2(tt*0.8, -tt*0.5)).yz*0.3 + noised(q*6.1 + vec2(-tt, tt*1.2)).yz*0.2;
    float amp = 0.11/(1.0 + tw*0.18);
    vec3 n = normalize(vec3(-g.x*amp, 1.0, -g.y*amp));
    float fres = 0.02 + 0.98*pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
    vec3 rr = reflect(rd, n); rr.y = abs(rr.y) + 0.002; rr = normalize(rr);
    vec3 refl = sky(p, rr);
    float tr = marchRefl(p, rr, min(30.0, (hmax - p.y)/rr.y));
    if (tr > 0.0) {
      vec3 rp = p + rr*tr; float e = 0.06;
      vec3 rn = normalize(vec3(mapH(rp.xz - vec2(e, 0.0)) - mapH(rp.xz + vec2(e, 0.0)), 2.0*e, mapH(rp.xz - vec2(0.0, e)) - mapH(rp.xz + vec2(0.0, e))));
      refl = atmosphere(shadeLand(rp, rn, lit ? 0.8 : 0.0, rr), p, rr, tr);
    }
    float sunUp = clamp(uLightDir.y, 0.0, 1.0);
    vec3 col = mix(mix(uDeep, uShallow, exp(-depth*5.0))*(ambient()*1.6 + uLightCol*sunUp*0.85), refl, fres);
    float sh = lit ? shadow(p, uLightDir, hmax) : 0.0;
    col += uLightCol*pow(clamp(dot(rr, uLightDir), 0.0, 1.0), 240.0)*4.0*sh;
    float foam = smoothstep(0.03, 0.0, depth)*(0.45 + 0.55*vnoise(p.xz*40.0 + uTime*0.4));
    col = mix(col, vec3(0.80, 0.86, 0.90)*(ambient()*1.6 + uLightCol*sunUp), foam*0.55);
    return atmosphere(col, ro, rd, tw);
  }
  return sky(ro, rd);
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes)/uRes.y;
  vec3 rd = normalize(uv.x*uCx + uv.y*uCy + 0.72*uCz);
  vec3 col = render(uRo, rd)*uExposure;
  col = pow(aces(col), vec3(1.0/2.2));
  col = mix(vec3(dot(col, vec3(0.299, 0.587, 0.114))), col, 1.12);       // a touch more colour
  fragColor = vec4(col, 1.0);
}`;

const BLIT = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uScale, uTexel, uRes; uniform float uTime;
out vec4 fragColor;
float hash(vec2 p){ vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
void main(){
  vec2 uv = gl_FragCoord.xy/uRes, lim = uScale - uTexel*0.5, st = min(uv*uScale, lim);
  vec3 c = texture(uTex, st).rgb;
  vec3 b = texture(uTex, min(st + vec2(uTexel.x, 0.0), lim)).rgb + texture(uTex, st - vec2(uTexel.x, 0.0)).rgb
         + texture(uTex, min(st + vec2(0.0, uTexel.y), lim)).rgb + texture(uTex, st - vec2(0.0, uTexel.y)).rgb;
  c = clamp(c + (c - b*0.25)*0.5, 0.0, 1.0);                              // unsharp mask after the upscale
  vec2 q = uv - 0.5; c *= 1.0 - dot(q, q)*0.5;
